name: lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  qualidade:
    name: Qualidade do código
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Verifica a formatação
        run: |
          arquivos=$(gofmt -l .)
          if [ -n "$arquivos" ]; then
            echo "arquivos fora do padrão gofmt:"
            echo "$arquivos"
            exit 1
          fi

      - name: Staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.1 ./...
